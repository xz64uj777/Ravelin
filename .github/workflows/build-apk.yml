name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Embed Ravelin console
        run: |
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import base64, gzip, pathlib
          root = pathlib.Path('.')
          assets = pathlib.Path('app/src/main/assets/index.html')
          parts = sorted(root.glob('Ravelin.html.gz.b64.*'))
          b64p = root / 'Ravelin.html.gz.b64'
          htmlp = root / 'Ravelin.html'
          raw = None
          if parts:
              blob = ''.join(p.read_text().replace('\n','').replace(' ','') for p in parts)
              raw = gzip.decompress(base64.b64decode(blob))
              print('decoded', len(raw), 'bytes from', len(parts), 'parts')
          elif b64p.exists():
              raw = gzip.decompress(base64.b64decode(b64p.read_text().replace('\n','').replace(' ','')))
              print('decoded', len(raw), 'bytes from Ravelin.html.gz.b64')
          elif htmlp.exists() and htmlp.stat().st_size > 20000:
              raw = htmlp.read_bytes()
              print('copied Ravelin.html', len(raw))
          elif assets.exists() and assets.stat().st_size > 20000:
              print('using existing assets/index.html', assets.stat().st_size)
          else:
              raise SystemExit('no full console HTML found')
          if raw is not None:
              text = raw.decode('utf-8', errors='replace')
              text = text.replace("window.RAVELIN_BUILD='v40'", "window.RAVELIN_BUILD='v41'")
              text = text.replace("const RAVELIN_VERSION='40'", "const RAVELIN_VERSION='41'")
              text = text.replace('RAVELIN-KYLE-2026-V40', 'RAVELIN-KYLE-2026-V41')
              text = text.replace('>v40</strong>', '>v41</strong>')
              old = '''if(window.RavelinNative && RavelinNative.reloadLive){\n      try{ RavelinNative.reloadLive(url); return; }catch(e){}\n    }'''
              new = '''if(false && window.RavelinNative && RavelinNative.reloadLive){\n      try{ RavelinNative.reloadLive(url); return; }catch(e){}\n    }\n    ov('Update','Downloading\u2026',45);\n    const html=await fetchConsoleHtml();\n    if(window.RavelinNative && RavelinNative.applyHtml){\n      try{ RavelinNative.applyHtml(html); return; }catch(e){}\n    }'''
              if old in text:
                  text = text.replace(old, new, 1)
                  print('patched applyUpdate away from loader')
              else:
                  print('applyUpdate patch point not found')
              extra = '''\n<script>\n/* v41 persist helper */\n(function(){\n  var _au = window.applyUpdate;
  if(typeof _au !== 'function') return;
  window.applyUpdate = async function(){\n    try{\n      if(typeof ov==='function') ov('Update','Getting the newest Ravelin\u2026',18);
      var html = await fetchConsoleHtml();
      if(window.RavelinNative && RavelinNative.applyHtml){\n        RavelinNative.applyHtml(html); return;
      }\n      document.open(); document.write(html); document.close();
    }catch(e){\n      if(typeof ovHide==='function') ovHide();
      alert('Stay on Wi-Fi and tap Update now again.');
    }\n  };\n})();\n</script>\n'''
              if '</body>' in text:
                  text = text.replace('</body>', extra + '</body>', 1)
              raw = text.encode('utf-8')
              htmlp.write_bytes(raw)
              assets.write_bytes(raw)
              print('wrote assets/index.html', len(raw))
          PY
          wc -c app/src/main/assets/index.html || true
          grep -o 'v41' app/src/main/assets/index.html | head -3

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ravelin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
