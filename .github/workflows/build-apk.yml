name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Embed Ravelin console
        run: |
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import base64, gzip, pathlib
          root = pathlib.Path('.')
          assets = pathlib.Path('app/src/main/assets/index.html')
          parts = sorted(root.glob('Ravelin.html.gz.b64.*'))
          b64p = root / 'Ravelin.html.gz.b64'
          html = root / 'Ravelin.html'
          raw = None
          if parts:
              blob = ''.join(p.read_text().replace('\n','').replace(' ','') for p in parts)
              raw = gzip.decompress(base64.b64decode(blob))
              print('decoded', len(raw), 'bytes from', len(parts), 'parts')
          elif b64p.exists():
              raw = gzip.decompress(base64.b64decode(b64p.read_text().replace('\n','').replace(' ','')))
              print('decoded', len(raw), 'bytes from Ravelin.html.gz.b64')
          elif html.exists() and html.stat().st_size > 20000:
              raw = html.read_bytes()
              print('copied Ravelin.html', len(raw))
          elif assets.exists() and assets.stat().st_size > 20000:
              print('using existing assets/index.html', assets.stat().st_size)
          else:
              raise SystemExit('no full console HTML found')
          if raw is not None:
              html.write_bytes(raw)
              assets.write_bytes(raw)
              print('wrote assets/index.html', len(raw))
          PY
          wc -c app/src/main/assets/index.html || true
          grep -o 'v40' app/src/main/assets/index.html | head -1

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ravelin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
