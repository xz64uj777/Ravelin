name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Decode and embed Ravelin console
        run: |
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import base64, gzip, pathlib
          root = pathlib.Path('.')
          assets = pathlib.Path('app/src/main/assets/index.html')
          b64 = root / 'Ravelin.html.gz.b64'
          html = root / 'Ravelin.html'
          if b64.exists():
              raw = gzip.decompress(base64.b64decode(b64.read_text().replace('\n','').replace(' ','')))
              html.write_bytes(raw)
              assets.write_bytes(raw)
              print('decoded', len(raw), 'bytes from Ravelin.html.gz.b64')
          elif html.exists():
              assets.write_bytes(html.read_bytes())
              print('copied Ravelin.html into assets', html.stat().st_size)
          elif assets.exists():
              print('using existing assets/index.html', assets.stat().st_size)
          else:
              raise SystemExit('no console HTML found')
          PY
          wc -c app/src/main/assets/index.html Ravelin.html || true
          grep -o 'v38' app/src/main/assets/index.html | head -1

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ravelin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
