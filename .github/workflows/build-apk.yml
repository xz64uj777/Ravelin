name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Embed console if present
        run: |
          mkdir -p app/src/main/assets
          if [ -f Ravelin.html ]; then
            cp Ravelin.html app/src/main/assets/index.html
            echo "Embedded Ravelin.html into assets"
          elif [ -f app/src/main/assets/index.html ]; then
            echo "Using existing assets/index.html"
          else
            echo "Missing console HTML" >&2
            exit 1
          fi
          wc -c app/src/main/assets/index.html

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ravelin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
