<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ravelin</title>
<style>body{margin:0;background:#0F1418;color:#E8EEF2;font-family:system-ui,sans-serif;padding:28px 20px}p{color:#A8B6C0}</style>
</head>
<body>
<p id="s">Loading Ravelin…</p>
<script>
(async function(){
  var base='https://raw.githubusercontent.com/xz64uj777/Ravelin/main/console/';
  var parts=['c0.txt','c1.txt','c2.txt','c3.txt'];
  try{
    var texts=await Promise.all(parts.map(function(p){
      return fetch(base+p+'?v=38',{cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error(p+' '+r.status);
        return r.text();
      });
    }));
    var html=texts.join('');
    document.open();document.write(html);document.close();
  }catch(e){
    var el=document.getElementById('s');
    el.textContent='Need a network connection the first time to load the console. '+e;
  }
})();
</script>
</body>
</html>
