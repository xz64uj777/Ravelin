<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ravelin</title>
<style>
body{margin:0;background:#0F1418;color:#E8EEF2;font-family:system-ui,sans-serif;padding:28px 20px}
h1{margin:0 0 8px;font-size:28px}
p{color:#A8B6C0;line-height:1.5}
button{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;margin-top:10px}
.bp{background:#7DD3C7;color:#071016}
.bg{background:transparent;color:#7DD3C7;border:1px solid #2A3642}
#s{margin-top:12px}
</style>
</head>
<body>
<h1>Ravelin</h1>
<p>You install the app once. After that, tap Update.</p>
<p id="s">Getting the newest version…</p>
<button class="bp" type="button" onclick="go()">Update now</button>
<button class="bg" type="button" onclick="go()">Try again</button>
<script>
const BASE='https://raw.githubusercontent.com/xz64uj777/Ravelin/main/';
function say(t){var el=document.getElementById('s'); if(el) el.textContent=t;}
function decodeB64Utf8(b64){
  var clean=String(b64||'').replace(/\s/g,'');
  var bin=atob(clean);
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
async function fromParts(){
  var texts=await Promise.all(Array.from({length:12},function(_,i){
    return fetch(BASE+'console/p'+i+'.b64?t='+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('p'+i);
      return r.text();
    });
  }));
  var html=decodeB64Utf8(texts.join(''));
  if(html.length<20000 || html.indexOf('function applyUpdate')<0) throw new Error('short');
  return html;
}
async function fromGzip(){
  var names=['Ravelin.html.gz.b64.0','Ravelin.html.gz.b64.1','Ravelin.html.gz.b64.2'];
  var texts=await Promise.all(names.map(function(p){
    return fetch(BASE+p+'?t='+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error(p);
      return r.text();
    });
  }));
  var clean=texts.join('').replace(/\s/g,'');
  var bin=atob(clean);
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  var ds=new DecompressionStream('gzip');
  var stream=new Blob([bytes]).stream().pipeThrough(ds);
  var html=await new Response(stream).text();
  if(html.length<20000 || html.indexOf('function applyUpdate')<0) throw new Error('shortgz');
  return html;
}
async function go(){
  say('Updating…');
  try{
    var html;
    try{ html=await fromParts(); }
    catch(e){ html=await fromGzip(); }
    if(window.RavelinNative && RavelinNative.applyHtml){
      RavelinNative.applyHtml(html);
      return;
    }
    document.open(); document.write(html); document.close();
  }catch(e){
    try{
      var r=await fetch(BASE+'version.json?t='+Date.now(),{cache:'no-store'});
      var v=await r.json();
      say('Latest on the server is v'+(v.version||'?')+'. Stay on Wi-Fi and tap Update now.');
    }catch(e2){
      say('Need Wi-Fi. Then tap Update now.');
    }
  }
}
go();
</script>
</body>
</html>
